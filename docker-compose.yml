services:
  backend:
    build:
      context: ./app
    container_name: devops_backend
    environment:
      DB_HOST: db
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devopspass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops_network

  db:
    image: postgres:16
    container_name: devops_db
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devopspass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_network

  nginx:
    image: nginx:alpine
    container_name: devops_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - devops_network

  prometheus:
    image: prom/prometheus:latest
    container_name: devops_prometheus
    ports:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-exporter
    networks:
      - devops_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: devops_node_exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - devops_network

volumes:
  postgres_data:

networks:
  devops_network:
    driver: bridge
